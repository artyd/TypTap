<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:100%;height:100%">
  <sc-if value="{{ isHippo }}" hint-placeholder-val="{{ false }}"><dc-import name="Hippo" mood="{{ mood }}" hint-size="100%,100%"></dc-import></sc-if>
  <sc-if value="{{ isCat }}" hint-placeholder-val="{{ true }}"><dc-import name="Cat" mood="{{ mood }}" hint-size="100%,100%"></dc-import></sc-if>
  <sc-if value="{{ isChick }}" hint-placeholder-val="{{ false }}"><dc-import name="Chick" mood="{{ mood }}" hint-size="100%,100%"></dc-import></sc-if>
  <sc-if value="{{ isBunny }}" hint-placeholder-val="{{ false }}"><dc-import name="Bunny" mood="{{ mood }}" hint-size="100%,100%"></dc-import></sc-if>
  <sc-if value="{{ isMouse }}" hint-placeholder-val="{{ false }}"><dc-import name="Mouse" mood="{{ mood }}" hint-size="100%,100%"></dc-import></sc-if>
  <sc-if value="{{ isBear }}" hint-placeholder-val="{{ false }}"><dc-import name="Bear" mood="{{ mood }}" hint-size="100%,100%"></dc-import></sc-if>
  <sc-if value="{{ isDog }}" hint-placeholder-val="{{ false }}"><dc-import name="Dog" mood="{{ mood }}" hint-size="100%,100%"></dc-import></sc-if>
  <sc-if value="{{ isFish }}" hint-placeholder-val="{{ false }}"><dc-import name="Fish" mood="{{ mood }}" hint-size="100%,100%"></dc-import></sc-if>
  <sc-if value="{{ isSnake }}" hint-placeholder-val="{{ false }}"><dc-import name="Snake" mood="{{ mood }}" hint-size="100%,100%"></dc-import></sc-if>
  <sc-if value="{{ isMonkey }}" hint-placeholder-val="{{ false }}"><dc-import name="Monkey" mood="{{ mood }}" hint-size="100%,100%"></dc-import></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:120},&quot;a&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Hippo&quot;,&quot;Cat&quot;,&quot;Chick&quot;,&quot;Bunny&quot;,&quot;Mouse&quot;,&quot;Bear&quot;,&quot;Dog&quot;,&quot;Fish&quot;,&quot;Snake&quot;,&quot;Monkey&quot;],&quot;default&quot;:&quot;Cat&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mood&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;idle&quot;,&quot;ready&quot;,&quot;typing&quot;,&quot;win&quot;,&quot;lose&quot;],&quot;default&quot;:&quot;idle&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals(){
    const a = this.props.a || 'Cat';
    const keys = ['Hippo','Cat','Chick','Bunny','Mouse','Bear','Dog','Fish','Snake','Monkey'];
    const o = { mood: this.props.mood || 'idle' };
    keys.forEach(k => o['is'+k] = a === k);
    return o;
  }
}
</script>
</body>
</html>
