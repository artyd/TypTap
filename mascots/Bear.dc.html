<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes tt-breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes tt-blink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes tt-float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(8deg)}}
@keyframes tt-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes tt-speed{0%{opacity:0;transform:translateX(5px)}45%{opacity:.9}100%{opacity:0;transform:translateX(-12px)}}
@keyframes tt-tear{0%{opacity:0;transform:translateY(-1px)}25%{opacity:1}100%{opacity:0;transform:translateY(11px)}}
@keyframes tt-jump{0%,100%{transform:translateY(0)}28%{transform:translateY(-9px)}52%{transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center">
<svg viewBox="0 0 120 120" style="width:100%;height:100%;overflow:visible" aria-hidden="true">
  <ellipse cx="60" cy="113" rx="27" ry="5" fill="rgba(30,25,20,.12)"></ellipse>
  <g style="animation:tt-breathe 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom">
    <circle cx="40" cy="30" r="11" fill="#A9764E"></circle>
    <circle cx="80" cy="30" r="11" fill="#A9764E"></circle>
    <circle cx="40" cy="30" r="5.5" fill="#7A5232"></circle>
    <circle cx="80" cy="30" r="5.5" fill="#7A5232"></circle>
    <path d="M60 30 C86 30 96 50 96 72 C96 96 80 106 60 106 C40 106 24 96 24 72 C24 50 34 30 60 30 Z" fill="#A9764E"></path>
    <ellipse cx="60" cy="83" rx="21" ry="17" fill="#E9D3BC"></ellipse>
    <rect x="42" y="101" width="14" height="10" rx="5" fill="#855A38"></rect>
    <rect x="64" y="101" width="14" height="10" rx="5" fill="#855A38"></rect>
    <path d="M40 90 Q60 97 80 90 L80 95 Q60 101 40 95 Z" fill="#D6534B"></path>
    <path d="M74 94 l9 8 l-6 2 l-5 -7 Z" fill="#BC463F"></path>
    <ellipse cx="60" cy="72" rx="14" ry="10" fill="#E9D3BC"></ellipse>
    <ellipse cx="60" cy="63" rx="4.5" ry="3.5" fill="#4A3524"></ellipse>

    <sc-if value="{{ isIdle }}" hint-placeholder-val="{{ true }}"><g>
      <g style="animation:tt-blink 4s infinite;transform-box:fill-box;transform-origin:center">
        <circle cx="48" cy="57" r="4.5" fill="#2A211C"></circle>
        <circle cx="72" cy="57" r="4.5" fill="#2A211C"></circle>
        <circle cx="49.6" cy="55.4" r="1.5" fill="#fff"></circle>
        <circle cx="73.6" cy="55.4" r="1.5" fill="#fff"></circle>
      </g>
      <path d="M60 67 Q53 74 47 70" stroke="#2A211C" stroke-width="3" fill="none" stroke-linecap="round"></path>
      <path d="M60 67 Q67 74 73 70" stroke="#2A211C" stroke-width="3" fill="none" stroke-linecap="round"></path>
    </g></sc-if>

    <sc-if value="{{ isReady }}" hint-placeholder-val="{{ true }}"><g>
      <circle cx="48" cy="57" r="5.5" fill="#2A211C"></circle>
      <circle cx="72" cy="57" r="5.5" fill="#2A211C"></circle>
      <circle cx="50.2" cy="54.8" r="2" fill="#fff"></circle>
      <circle cx="74.2" cy="54.8" r="2" fill="#fff"></circle>
      <circle cx="37" cy="67" r="4" fill="#E7A9A0" opacity=".85"></circle>
      <circle cx="83" cy="67" r="4" fill="#E7A9A0" opacity=".85"></circle>
      <path d="M50 68 Q60 80 70 68 Z" fill="#2A211C"></path>
      <path d="M55 74 Q60 78 65 74" fill="#D96A5A"></path>
      <path d="M18 30 l1.6 4 l4 1.6 l-4 1.6 l-1.6 4 l-1.6 -4 l-4 -1.6 l4 -1.6 Z" fill="#FFB020" style="animation:tt-float 2.6s ease-in-out infinite"></path>
      <path d="M100 40 l1.4 3.6 l3.6 1.4 l-3.6 1.4 l-1.4 3.6 l-1.4 -3.6 l-3.6 -1.4 l3.6 -1.4 Z" fill="#FFB020" style="animation:tt-float 3s ease-in-out infinite .3s"></path>
    </g></sc-if>

    <sc-if value="{{ isTyping }}" hint-placeholder-val="{{ true }}"><g>
      <circle cx="49" cy="59" r="3.6" fill="#2A211C"></circle>
      <circle cx="71" cy="59" r="3.6" fill="#2A211C"></circle>
      <ellipse cx="60" cy="71" rx="3.5" ry="2.8" fill="#2A211C"></ellipse>
      <g stroke="#C8A886" stroke-width="3" stroke-linecap="round">
        <line x1="8" y1="60" x2="18" y2="60" style="animation:tt-speed 1s linear infinite"></line>
        <line x1="6" y1="70" x2="18" y2="70" style="animation:tt-speed 1s linear infinite .33s"></line>
        <line x1="9" y1="80" x2="18" y2="80" style="animation:tt-speed 1s linear infinite .66s"></line>
      </g>
    </g></sc-if>

    <sc-if value="{{ isWin }}" hint-placeholder-val="{{ true }}"><g>
      <path d="M48 51 l1.7 4.2 l4.2 1.7 l-4.2 1.7 l-1.7 4.2 l-1.7 -4.2 l-4.2 -1.7 l4.2 -1.7 Z" fill="#2A211C"></path>
      <path d="M72 51 l1.7 4.2 l4.2 1.7 l-4.2 1.7 l-1.7 4.2 l-1.7 -4.2 l-4.2 -1.7 l4.2 -1.7 Z" fill="#2A211C"></path>
      <circle cx="37" cy="67" r="4" fill="#E7A9A0" opacity=".9"></circle>
      <circle cx="83" cy="67" r="4" fill="#E7A9A0" opacity=".9"></circle>
      <path d="M47 67 Q60 84 73 67 Z" fill="#2A211C"></path>
      <path d="M54 74 Q60 79 66 74" fill="#D96A5A"></path>
      <rect x="16" y="24" width="7" height="7" rx="1.5" fill="#FFB020" transform="rotate(20 19 27)" style="animation:tt-float 2.4s ease-in-out infinite"></rect>
      <rect x="98" y="30" width="7" height="7" rx="1.5" fill="#E86A82" transform="rotate(-15 101 33)" style="animation:tt-float 2.8s ease-in-out infinite .2s"></rect>
      <path d="M60 14 l1.7 4.2 l4.2 1.7 l-4.2 1.7 l-1.7 4.2 l-1.7 -4.2 l-4.2 -1.7 l4.2 -1.7 Z" fill="#FFB020" style="animation:tt-float 2.6s ease-in-out infinite .4s"></path>
    </g></sc-if>

    <sc-if value="{{ isLose }}" hint-placeholder-val="{{ true }}"><g>
      <path d="M43 60 Q48 55 53 60" stroke="#2A211C" stroke-width="3" fill="none" stroke-linecap="round"></path>
      <path d="M67 60 Q72 55 77 60" stroke="#2A211C" stroke-width="3" fill="none" stroke-linecap="round"></path>
      <path d="M50 76 Q55 71 60 75 Q65 79 70 74" stroke="#2A211C" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
      <path d="M45 62 q-3 5 0 8 q3 -3 0 -8 Z" fill="#5BB8C9" style="animation:tt-tear 2.2s ease-in-out infinite"></path>
      <polyline points="84,30 92,30 84,38 92,38" stroke="#C29A78" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"></polyline>
    </g></sc-if>
  </g>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:180,&quot;height&quot;:180},&quot;mood&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;idle&quot;,&quot;ready&quot;,&quot;typing&quot;,&quot;win&quot;,&quot;lose&quot;],&quot;default&quot;:&quot;ready&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals(){
    const m = this.props.mood || 'ready';
    return {
      isIdle: m === 'idle',
      isReady: m === 'ready',
      isTyping: m === 'typing',
      isWin: m === 'win',
      isLose: m === 'lose'
    };
  }
}
</script>
</body>
</html>
