# TypTap — host-nginx server block.
# 1) отдаёт статику (index.html, support.js, Mascot.dc.html);
# 2) проксирует /api/* на Node-бэкенд в Docker (127.0.0.1:8010).
# ПРИМЕЧАНИЕ: основной путь развёртывания — Caddy (caddy/Caddyfile). Это запасной вариант.
#
# Установка (см. DEPLOY.md): скопировать в /etc/nginx/sites-available/typtap.conf,
# поправить `root`, сделать симлинк в sites-enabled, `nginx -t && systemctl reload nginx`,
# затем `certbot --nginx -d typtap.alliancegroup95.com` — он сам допишет TLS (443) и редирект.

server {
    listen 80;
    listen [::]:80;
    server_name typtap.alliancegroup95.com;

    # ВАЖНО: путь до каталога, куда склонирован репозиторий (где лежит index.html).
    # Замени, если клонировал в другое место.
    root /var/www/typtap;
    index index.html;

    # gzip для текстовых ответов.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- API → Node backend (Docker, только loopback) ----
    # Трейлинг-слэш у proxy_pass срезает префикс /api:
    #   /api/login  ->  http://127.0.0.1:8010/login
    location /api/ {
        proxy_pass http://127.0.0.1:8010/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ---- статика ----
    # index.html не кэшируем агрессивно, чтобы обновления приложения доезжали.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
